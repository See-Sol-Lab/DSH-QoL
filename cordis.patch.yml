# DSH 生活质量包的组合层。
#
# 注意：补丁里的 config 是整份替换，不是合并（官方 app-boot 的约定）。所以每条
# 覆盖都照抄官方 0.2.1-rc.2 组合里的完整配置，只改开关那一个字段；官方升级改了
# 这些配置时，这里要跟着核对。
#
# 本层排在官方 web-app 组合之后，所以下面的覆盖能盖住官方默认；用户在
# 「设置 → 生活质量包」里打开某一项时，写进自己的 profile 补丁，补丁层又
# 排在所有组合之后，用户的选择说了算。卸载本包后这四项回到官方默认。

- insert:
    - id: dsh-qol
      name: '@see-sol-lab/dsh-qol'
    # 助手用的 Git 与 PR 工具（从 DeepSeekGUI 搬来）：本地 git 读写、gh 建 PR、
    # 以及暴露给模型的工具集。写操作都要用户审批。
    - id: qol-git
      name: '@see-sol-lab/dsh-qol/git-local'
    - id: qol-pull-request-gh
      name: '@see-sol-lab/dsh-qol/pull-request-gh'
    - id: qol-coding-tools
      name: '@see-sol-lab/dsh-qol/coding-tools'

# 桌面产品统计：界面操作事件（带设备与账号 ID）。可热改。
- id: product-analytics
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION

# 会话日志：随官方模型请求附带整段会话记录。可热改。
- id: session-log-deepseek
  config:
    enabled: false

# 插件清单：随官方模型请求附带已启用插件。不可热改：界面开关写本包字段，由 lib/index.js 经 configEditor 改这里，官方随即重载这个组件。
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# 反馈上传：点反馈或打分时上传当时的会话记录。不可热改：界面开关写本包字段，由 lib/index.js 经 configEditor 改这里，官方随即重载这个组件。
- id: session-telemetry-otel
  config:
    mode: DISABLED
    shutdownTimeoutMillis: 3000
    maxRequestBytes: 4000000
    exporter:
      url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500
